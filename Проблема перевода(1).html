<style>
/* Layout: one horizontal axis shared by four colour-coded lines; arcs rise above it on hover; the chosen event's card sits below. Type nods to IBM punch-card era of Busa. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --ink:#1C1F23; --muted:#5B6168; --faint:#8C9298; --rule:#D3D6CF;
  --data:#9C6312; --twin:#0F766B; --born:#6A4BB0; --refl:#B4364A;
  --arc:#1C1F23; --cursor:#1C1F23;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131518; --surface:#1B1E22; --ink:#E6E8E3; --muted:#A0A7AE; --faint:#737A82; --rule:#2E333A;
  --data:#E1A54B; --twin:#43C2B1; --born:#A88EF2; --refl:#F27A8A; --arc:#E6E8E3; --cursor:#E6E8E3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131518; --surface:#1B1E22; --ink:#E6E8E3; --muted:#A0A7AE; --faint:#737A82; --rule:#2E333A;
  --data:#E1A54B; --twin:#43C2B1; --born:#A88EF2; --refl:#F27A8A; --arc:#E6E8E3; --cursor:#E6E8E3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-inline:clamp(16px,4vw,48px);padding-block:32px 64px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(34px,5vw,56px);line-height:1.02}
h2{font-size:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header{display:flex;flex-direction:column;gap:10px}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:12px}
.prose p{margin:0}
section.ainote{max-width:68ch;border-left:3px solid var(--rule);border-radius:0;padding:2px 0 2px 16px;display:flex;flex-direction:column;gap:6px}
section.ainote h2{font-size:15px;font-family:var(--f-mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
section.ainote p{margin:0;color:var(--muted)}
details.intro summary{cursor:pointer;font-family:var(--f-display);font-size:15px;color:var(--muted);list-style:none}
details.intro summary::before{content:"▸ ";}
details.intro[open] summary::before{content:"▾ ";}
details.intro[open] summary{margin-bottom:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;font-family:var(--f-display);font-size:14px}
.legend,.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.chip .sw{width:12px;height:12px;border-radius:3px;background:var(--c)}
.chip.pt .sw{border-radius:50%}
button.ctl{border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:6px;font:inherit;min-width:34px;height:32px;padding:0 10px;cursor:pointer}
button.ctl:hover,.chip:hover{border-color:var(--faint)}
button:focus-visible,.chip:focus-visible,.ev:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.zoomval{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-width:3.2em;text-align:center}
.stage{background:var(--surface);border:1px solid var(--rule);border-radius:10px;display:flex;flex-direction:column}
.status{font-family:var(--f-display);font-size:14px;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--rule);min-height:42px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.status b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.status .it{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.scroller{overflow-x:auto;overflow-y:hidden;position:relative;overscroll-behavior-x:contain}
svg.tl{display:block}
.tl text{font-family:var(--f-display);font-size:12.5px;fill:var(--ink)}
.tl .yr{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.tl .axis{stroke:var(--ink);stroke-width:1}
.tl .tick{stroke:var(--faint);stroke-width:1}
.tl .grid{stroke:var(--rule);stroke-width:1}
.ev{cursor:pointer;transition:opacity .15s}
.ev.dim{opacity:.22}
.ev .mk{stroke:var(--c);stroke-width:1.5}
.ev rect.mk{fill:color-mix(in srgb,var(--c) 20%,var(--surface))}
.ev circle.mk{fill:var(--c)}
.ev.hl .mk{stroke-width:2.5}
.ev.sel .mk{stroke:var(--ink);stroke-width:2.5}
.ev .lab{font-weight:500}
.ev .lbr{fill:none;stroke:var(--muted);stroke-width:1.2}
.arc{fill:none;stroke:var(--arc);stroke-width:1.6;opacity:.85}
.arc.faint{opacity:.16;stroke-width:1}
.arc.hit{stroke:transparent;stroke-width:12;opacity:1;cursor:help}
.drop{stroke:var(--arc);stroke-width:1;stroke-dasharray:2 3;opacity:.5}
.cur{stroke:var(--cursor);stroke-width:1;opacity:.55}
.curlab{font-family:var(--f-mono);font-size:12px;font-weight:500;fill:var(--ink)}
.curbg{fill:var(--surface);stroke:var(--ink);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--ink);border-radius:6px;padding:7px 10px;font-family:var(--f-display);font-size:13.5px;line-height:1.35;max-width:300px;z-index:3}
.tip b{font-weight:600}
.hint{font-family:var(--f-display);font-size:13px;color:var(--faint);padding:8px 16px 12px}
.card{background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--c);border-radius:10px;padding:22px clamp(16px,3vw,32px);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px}
@media (max-width:820px){.card{grid-template-columns:minmax(0,1fr)}}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.tag{font-family:var(--f-display);font-size:13px;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.tag::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.card h2{font-size:clamp(24px,3vw,32px);margin:8px 0 4px}
.card .orig{font-family:var(--f-display);color:var(--muted);font-size:15px;margin:0}
.card .short{font-size:18px;line-height:1.5;margin:14px 0 0;max-width:62ch}
.card .desc{margin:14px 0 0;max-width:68ch;color:var(--ink)}
.card .labor{margin-top:12px;font-family:var(--f-display);font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.side h3{font-size:14px;font-family:var(--f-mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.lk{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.lk button{all:unset;cursor:pointer;display:block;border-left:3px solid var(--c);padding:2px 0 2px 10px}
.lk button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lk .t{font-family:var(--f-display);font-weight:600;font-size:15px}
.lk .w{display:block;font-size:14.5px;line-height:1.45;color:var(--muted)}
.lk button:hover .t{text-decoration:underline}
.src{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.45}
.src a{color:var(--ink);text-decoration-color:var(--faint);text-underline-offset:3px}
.src .au{font-family:var(--f-display);font-weight:500}
section.end{display:flex;flex-direction:column;gap:14px}
.allsrc{columns:2 360px;column-gap:40px}
.allsrc li{break-inside:avoid;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.ev{transition:none}}
</style>

<script>
const D = {"lanes": [{"id": "data", "title": "Извлечённые данные", "hint": "Не-цифровой источник переводится в счётные единицы: словоформы, записи, рейсы."}, {"id": "surrogate", "title": "Цифровой двойник", "hint": "Не-цифровой объект получает цифровую копию: размеченный текст, изображение, OCR."}, {"id": "born", "title": "Born-digital", "hint": "Объект изначально цифровой и доходит до исследователя только через архив."}, {"id": "reflection", "title": "Рефлексия", "hint": "Тексты, где проблема перевода названа и обсуждается."}], "events": [{"id": "busa", "lane": "data", "kind": "span", "start": 1949, "end": 1951, "title": "Буза, IBM и Index Thomisticus", "orig": "Busa, IBM and the Index Thomisticus", "short": "Корпус Фомы Аквинского переводят на перфокарты; уже здесь объектом анализа становится модель текста, а не сам текст.", "description": "В 1949 году иезуит Роберто Буза договаривается с Томасом Уотсоном из IBM о машинной обработке корпуса Фомы Аквинского. В 1951 году выходит первый отчёт о словоуказателе, составленном перфокартными машинами. Это начало полосы извлечённых данных и канонический миф основания DH: в 2004 году Companion to Digital Humanities задним числом вписывает Бузу в генеалогию дисциплины. Для оптики «цифровые методы для не-цифровых объектов» случай пограничный. Чтобы машина могла считать, текст разбили на единицы, лемматизировали и разметили, и каждое такое решение было интерпретацией. Поэтому объект анализа уже не корпус Фомы, а его модель. Проблема перевода возникает в момент рождения практики, до всякой теории. За мифом об одиноком учёном с перфокартами стоит и вторая линия: карты пробивали и проверяли в основном молодые женщины-операторы, чей труд Найхан реконструирует для 1954–1967 годов. Перевод объекта в данные оказывается ещё и трудом, который рассказ об автоматизации делает невидимым.", "labor": true, "sources": [{"author": "Hockey S.", "year": 2004, "title": "The History of Humanities Computing // A Companion to Digital Humanities", "url": "https://companions.digitalhumanities.org/DH/content/9781405103213_chapter_1.html"}, {"author": "Terras M., Nyhan J.", "year": 2016, "title": "Father Busa's Female Punch Card Operatives // Debates in the Digital Humanities 2016", "url": "https://dhdebates.gc.cuny.edu/read/untitled/section/1e57217b-f262-4f25-806b-4fcf1548beb5"}, {"author": "Nyhan J.", "year": 2023, "title": "Hidden and Devalued Feminized Labour in the Digital Humanities: On the Index Thomisticus Project 1954–67. Routledge", "url": "https://www.routledge.com/Hidden-and-Devalued-Feminized-Labour-in-the-Digital-Humanities-On-the-Index-Thomisticus-Project-1954-67/Nyhan/p/book/9780367685980"}], "label": "Буза"}, {"id": "fogel", "lane": "data", "kind": "span", "start": 1974, "end": 1975, "title": "«Время на кресте» и ответ Гутмана", "orig": "Fogel & Engerman, Time on the Cross vs Gutman, Slavery and the Numbers Game", "short": "Спор о том, что вычисление наследует взгляд того, кто вёл запись в источнике.", "description": "«Time on the Cross» (1974) переводит в числа купчие, описи, переписные листы 1860 года и дневник плантатора, чтобы эконометрически оценить эффективность рабовладельческого хозяйства. Ответ Гутмана «Slavery and the Numbers Game» (1975) разбирает прежде всего то, что предшествует арифметике. Самое известное число книги, 0,7 порки на раба в год, взято из записей одной плантации, которые вёл сам хозяин, и Гутман пересчитывает его вручную. Спор идёт о точке зрения, зашитой в источник: извлечённые данные наследуют взгляд того, кто вёл запись, и вычисление этого не снимает. Сорок лет спустя это назовут ситуированностью данных. К истории DH кейс относится условно. Институционально это клиометрика и экономическая история. В каноне DH (глава Томаса в Companion 2004 года) он вспоминается как травма, после которой вычислительные методы в американской истории на два десятилетия оказались в обороне. Поэтому событие стоит как пограничное: по объекту оно попадает в оптику «цифровые методы для не-цифровых объектов», по дисциплине нет.", "sources": [{"author": "Fogel R. W., Engerman S. L.", "year": 1974, "title": "Time on the Cross: The Economics of American Negro Slavery. Little, Brown", "url": null}, {"author": "Gutman H. G.", "year": 1975, "title": "Slavery and the Numbers Game: A Critique of Time on the Cross. University of Illinois Press", "url": null}, {"author": "Thomas W. G. III", "year": 2004, "title": "Computing and the Historical Imagination // A Companion to Digital Humanities", "url": "https://companions.digitalhumanities.org/DH/content/9781405103213_chapter_5.html"}], "label": "Фогель–Гутман"}, {"id": "tei", "lane": "surrogate", "kind": "span", "start": 1987, "end": 2011, "title": "Text Encoding Initiative: спор о тексте и документе", "orig": "Text Encoding Initiative debate", "short": "Копией чего является размеченный текст? Через двадцать с лишним лет стандарт пересматривает собственный ответ.", "description": "Отрезок от встречи в Вассар-колледже в ноябре 1987 года, где сформулированы Poughkeepsie Principles, до TEI P5 2.0 в декабре 2011 года. Уже в принципах среди целей кодирования названы интерпретация и анализ, то есть двойник с самого начала мыслится как модель. Дальше разворачивается спор о том, копией чего является размеченный текст. Модель OHCO (ДеРоуз и соавторы, 1990) утверждает, что текст есть упорядоченная иерархия смысловых объектов и разметка лишь описывает то, что в нём уже есть. Сперберг-Маккуин (1991) отвечает, что любое электронное представление текста воплощает представление о том, что в нём важно, а схема кодирования сама является теорией текста. В докладе 1992 года (опубликован в 1996-м) авторы OHCO признают, что опыт кодировщиков подрывает их тезис: в стихотворной драме реплики, строки и предложения перекрываются и не укладываются в одну иерархию. Буццетти (1999) называет корень путаницы — незаметный сдвиг от структуры документа к структуре текста. В 2011 году стандарт, созданный для абстрактного «текста», получает средства для описания материального документа. Это вопрос Бузы, поставленный теоретически, и пример нелинейности: исходное решение через двадцать с лишним лет пересматривается изнутри самой практики.", "sources": [{"author": "Ide N.", "year": null, "title": "The Text Encoding Initiative (история проекта)", "url": "https://www.cs.vassar.edu/~ide/papers/teiHistory.pdf"}, {"author": "DeRose S. J., Durand D. G., Mylonas E., Renear A. H.", "year": 1990, "title": "What is Text, Really? // Journal of Computing in Higher Education 1(2): 3–26", "url": "https://doi.org/10.1007/BF02941632"}, {"author": "Sperberg-McQueen C. M.", "year": 1991, "title": "Text in the Electronic Age: Textual Study and Text Encoding, with Examples from Medieval Texts // Literary and Linguistic Computing 6(1): 31–46", "url": null}, {"author": "Renear A., Mylonas E., Durand D.", "year": 1996, "title": "Refining our Notion of What Text Really Is: The Problem of Overlapping Hierarchies // Research in Humanities Computing 4 (доклад 1992)", "url": "https://ideals.illinois.edu/items/9468"}, {"author": "Buzzetti D.", "year": 1999, "title": "Text Representation and Textual Models // ACH-ALLC 1999", "url": "https://www2.iath.virginia.edu/ach-allc.99/proceedings/buzzetti.html"}, {"author": "TEI Consortium", "year": 2011, "title": "P5 version 2.0 release notes", "url": "https://tei-c.org/release/doc/tei-p5-doc/readme-2.0.html"}], "label": "TEI"}, {"id": "slavetrade", "lane": "data", "kind": "span", "start": 1990, "end": 2008, "title": "База данных трансатлантической работорговли", "orig": "Trans-Atlantic Slave Trade Database", "short": "Проблема спора Фогеля и Гутмана в масштабе инфраструктуры: язык учёта становится форматом базы.", "description": "Наборы данных о рейсах складывались у разных исследователей с 1960–70-х годов. В 1990 году начинается их сведение в единую базу при Институте Дюбуа в Гарварде; в 1999 году она выходит на CD-ROM (27 233 рейса), в 2008 году открывается сайт Voyages (около 35 тысяч рейсов). Это вершина полосы извлечённых данных: рейсы восстановлены по портовым книгам, налоговым реестрам и судовым журналам. Проблема спора Фогеля и Гутмана возвращается здесь в масштабе инфраструктуры. Источники составлены работорговцами и для работорговли, и порабощённые люди присутствуют в них как груз: число, пол, возраст, смертность в пути. Перевод в данные стандартизирует эту оптику и делает её удобной для запроса. Критика базы (Джессика Мари Джонсон, «Markup Bodies», 2018) спрашивает, может ли цифровая история рабства не воспроизводить язык учёта. Событие показывает и другое: извлечённые данные не уходят со сцены с появлением двойников и born-digital, а развиваются параллельно с ними.", "sources": [{"author": "NEH", "year": null, "title": "The Transatlantic Slave Trade Database", "url": "https://www.neh.gov/project/transatlantic-slave-trade-database"}, {"author": "SlaveVoyages", "year": 2024, "title": "History of the Project", "url": "https://legacy.slavevoyages.org/blog/history-project"}, {"author": "Johnson J. M.", "year": 2018, "title": "Markup Bodies: Black [Life] Studies and Slavery [Death] Studies at the Digital Crossroads // Social Text 36(4): 57–79", "url": "https://doi.org/10.1215/01642472-7145658"}], "label": "База работорговли"}, {"id": "beowulf", "lane": "surrogate", "kind": "span", "start": 1993, "end": 1999, "title": "«Электронный Беовульф»", "orig": "Electronic Beowulf", "short": "Цифровая копия показывает в рукописи буквы, которых не видно в оригинале.", "description": "Проект Кевина Кирнана и Британской библиотеки, начатый в 1993 году; CD-ROM вышел в 1999-м. Рукопись Cotton Vitellius A.xv пострадала при пожаре 1731 года, а в XIX веке её листы вставили в бумажные рамки, закрывшие часть букв по краям. Съёмка в ультрафиолете и с оптоволоконной подсветкой показала буквы, невидимые при чтении самой рукописи. Электронный двойник здесь даёт доступ к тексту больший, чем оригинал, и ломает иерархию «оригинал выше копии», которую незадолго до этого защищал Танселл. Вместе с TEI событие образует пару внутри полосы: TEI строит двойника как модель текста, «Беовульф» — как изображение документа. Копия и здесь не нейтральна. То, что видно в двойнике, определено выбранными режимами освещения и съёмки, так что двойник производит новое свидетельство, которого глаз в оригинале не видел.", "sources": [{"author": "Kiernan K.", "year": 1995, "title": "Electronic Beowulf Archives, 1993–1997", "url": "https://ebeowulf.uky.edu/ebeowulf-archives/index.html"}, {"author": "Kiernan K. (ed.)", "year": 1999, "title": "Electronic Beowulf. British Library, CD-ROM", "url": null}], "label": "«Электронный Беовульф»"}, {"id": "ia", "lane": "born", "kind": "span", "start": 1996, "end": null, "title": "Internet Archive и Wayback Machine", "orig": "The Internet Archive and Wayback Machine", "short": "Born-digital становится источником только через архив, а архив выдаёт копию, не совпадающую с живым вебом.", "description": "Брюстер Кейл основывает архив в 1996 году, когда исчезающие страницы и битые ссылки уже были заметной проблемой; в октябре 2001 года Wayback Machine открывается для публики. Это начало полосы born-digital, и новый тип объекта осознаётся как хрупкий с первого дня. Казалось бы, если оригинал цифровой, переводить нечего и копия ему идентична. Но архив избирателен с самого начала: краулер не захватывает страницы, генерируемые из баз данных, мультимедиа и закрытые сайты, владельцы могут потребовать удаления, а снимки первых лет собирала коммерческая Alexa Internet. Born-digital становится историческим источником только через архив, а архив выдаёт копию, которая не совпадает с живым вебом ни по составу, ни по времени. Проблема цифрового двойника возвращается на материале, у которого нет не-цифрового оригинала. Отрезок не закрыт, потому что архив продолжает расти. Архив же даёт материал для рефлексии: главный пример статьи Розенцвейга — удалённый сайт, сохранённый Wayback Machine.", "sources": [{"author": "Internet Archive", "year": 2001, "title": "Internet Archive launches Wayback Machine (пресс-релиз, 24.10.2001)", "url": "https://librarytechnology.org/pr/9384"}, {"author": "Internet Archive", "year": 1996, "title": "Wayback Machine's First Crawl", "url": "https://archive.org/details/wayback-machine-1996"}, {"author": "Internet Archive", "year": null, "title": "Wayback Machine", "url": "https://web.archive.org/"}], "label": "Internet Archive"}, {"id": "rosenzweig", "lane": "reflection", "kind": "point", "start": 2003, "end": null, "title": "Розенцвейг: «Дефицит или изобилие?»", "orig": "Scarcity or Abundance? Preserving the Past in a Digital Era", "short": "Историки впервые всерьёз обсуждают born-digital как источник — через семь лет после основания архива.", "description": "Статья Роя Розенцвейга в American Historical Review — одна из первых, где историки осмысляют born-digital как источник. Угроза двойная. Цифровые материалы исчезают быстрее бумажных, а то, что сохраняется, сохраняется в объёмах, к которым историческое ремесло не готово. Розенцвейг противопоставляет архивную логику отбора и каталогизации логике «сохранить всё и искать поисковиком» и замечает, что будущее прошлого, прежде общее достояние, переходит в частные руки. По отношению к практике это запоздалая рефлексия: Internet Archive работает семь лет, прежде чем историки ставят вопрос о нём как об источнике. Пара «архив 1996 — Розенцвейг 2003» фиксирует разрыв, который на шкале повторяется не раз: практика перевода опережает его осмысление.", "sources": [{"author": "Rosenzweig R.", "year": 2003, "title": "Scarcity or Abundance? Preserving the Past in a Digital Era // American Historical Review 108(3)", "url": "https://rrchnm.org/publications/scarcity-or-abundance-preserving-the-past-in-a-digital-era/"}], "label": "Розенцвейг"}, {"id": "rushdie", "lane": "born", "kind": "span", "start": 2006, "end": 2011, "title": "Архив Салмана Рушди в Эмори", "orig": "Salman Rushdie Papers, Emory University", "short": "Архив впервые принимает компьютеры писателя целиком; исследователь работает с эмуляцией его среды.", "description": "В 2006 году Университет Эмори получает архив Салмана Рушди: бумаги, а также настольный Mac, три ноутбука и внешний диск. В 2010 году открывается доступ, в том числе через эмуляцию его компьютера, которая при каждом запуске возвращается к исходному образу; в 2011 году архивисты публикуют отчёт о работе (Carroll et al., Archivaria). Событие переносит проблему born-digital с веба на личный архив писателя. Чтобы исследователи не путались в пустых папках, откуда изъяли закрытые материалы, архивисты пометили их цветом и сами признали, что внесли в «аутентичную» среду новые данные. Тогда же в Эмори звучит формула Эрики Фарр: Рушди не родился цифровым, но переродился цифровым. Слово reborn digital появляется у практиков за восемь лет до книги Брюггера. Кейс показывает отдельный механизм перерождения — реконструкцию среды: исследователь работает с моделью компьютера писателя.", "sources": [{"author": "Carroll L., Farr E., Hornsby P., Ranker B.", "year": 2011, "title": "A Comprehensive Approach to Born-Digital Archives // Archivaria 72", "url": "https://archivaria.ca/index.php/archivaria/article/download/13360/14664"}, {"author": "Emory Report", "year": 2010, "title": "Rushdie archive in paper, pixels (22.02.2010)", "url": "https://news.emory.edu/emory-report-archive/stories/2010/02/22/rushdie_archive.html"}], "label": "Архив Рушди"}, {"id": "geocities", "lane": "born", "kind": "span", "start": 2009, "end": 2010, "title": "Закрытие GeoCities и Archive Team", "orig": "GeoCities and Archive Team", "short": "Born-digital продолжает существовать только как спасённый волонтёрами, неполный корпус.", "description": "В апреле 2009 года Yahoo объявляет о закрытии GeoCities, одного из самых посещаемых сайтов конца 1990-х, и 26 октября 2009 года сервис закрывается. За эти месяцы волонтёры Archive Team спасают почти терабайт страниц и 26 октября 2010 года начинают раздавать их торрентом; Internet Archive параллельно делает свой обход. Born-digital исчезает как живая среда и продолжает существовать только как спасённый, неполный и неоднородный корпус, собранный энтузиастами, а не институцией. Миллиган (2017) показывает, что историк раннего веба работает со смесью формальных веб-архивов и «партизанских» дампов и вынужден читать их вычислительно, как целое, а не как отдельные документы. Это образцовый reborn-digital объект: он доступен исследователю только как результат спасения. В отличие от Internet Archive, здесь перерождение происходит под угрозой полной потери, и сам акт сохранения становится событием истории объекта.", "labor": true, "sources": [{"author": "Archive Team", "year": null, "title": "GeoCities Project", "url": "https://wiki.archiveteam.org/index.php/GeoCities_Project"}, {"author": "Milligan I.", "year": 2017, "title": "Welcome to the Web: The Online Community of GeoCities during the Early Years of the World Wide Web // The Web as History. UCL Press", "url": "https://mediarep.org/handle/doc/13430"}], "label": "GeoCities"}, {"id": "drucker", "lane": "reflection", "kind": "point", "start": 2011, "end": null, "title": "Дракер: data и capta", "orig": "Humanities Approaches to Graphical Display", "short": "Проблема, повторявшаяся на практике со времён Бузы, получает общее имя — capta.", "description": "Статья Джоанны Дракер в DHQ. Дракер обращает внимание на ход, который делают гуманитарии, заимствуя средства визуализации из естественных наук: вместе с графиками они принимают реалистскую посылку, будто данные — это наблюдение, независимое от наблюдателя, а график прозрачно его отображает. Она предлагает заменить data, «данное», на capta, «взятое»: всё, с чем работает гуманитарий, сконструировано выбором и интерпретацией, и визуализация должна это показывать, например изображая время и пространство такими, какими они переживаются. Для шкалы это первая точка, где проблема перевода, повторявшаяся на практике со времён Бузы, получает общее имя. Но и это имя запаздывает: термин capta раньше появляется в археологии (Чиппиндейл, 2000), а интерпретативность кодирования TEI признала ещё в 1987 году. Вопрос о переходе в данные всплывает у Дракер на уровне визуализации, то есть на последнем шаге работы с данными, а не при оцифровке.", "sources": [{"author": "Drucker J.", "year": 2011, "title": "Humanities Approaches to Graphical Display // DHQ 5(1)", "url": "http://www.digitalhumanities.org/dhq/vol/5/1/000091/000091.html"}, {"author": "Chippindale C.", "year": 2000, "title": "Capta and Data: On the True Nature of Archaeological Information // American Antiquity 65(4): 605–612", "url": "https://doi.org/10.2307/2694418"}], "label": "Дракер"}, {"id": "culturomics", "lane": "surrogate", "kind": "point", "start": 2011, "end": null, "title": "Культуромика: миллионы оцифрованных книг", "orig": "Quantitative Analysis of Culture Using Millions of Digitized Books", "short": "Данные извлекаются из двойников, и смещения OCR-корпуса выглядят как свойства культуры.", "description": "Статья Мишеля, Либермана Эйдена и соавторов в Science провозглашает «культуромику» — количественный анализ культуры по корпусу примерно из пяти миллионов книг, около 4% всего напечатанного, оцифрованных Google Books. Здесь слои накладываются: данные извлекаются из двойников, то есть из OCR-текста, и для анализа отбираются книги с лучшим качеством распознавания и метаданных. Смещения двойника наследуются данными, но в результатах невидимы: частота слова выглядит как свойство культуры, хотя это свойство корпуса. Последующая критика (Печеник, Данфорт и Доддс, 2015) показала, что корпус устроен как библиотека с одним экземпляром каждой книги, а доля научной литературы в нём растёт на протяжении XX века, и это искажает выводы. Событие стоит в полосе цифрового двойника, но работает на нелинейность: массовая оцифровка становится новым сырьём для извлечения данных, и вопрос Бузы возвращается на уровне всей книжной культуры.", "sources": [{"author": "Michel J.-B., Shen Y. K., Aiden A. P. et al.", "year": 2011, "title": "Quantitative Analysis of Culture Using Millions of Digitized Books // Science 331(6014)", "url": "https://dash.harvard.edu/handle/1/8899722"}, {"author": "Pechenick E. A., Danforth C. M., Dodds P. S.", "year": 2015, "title": "Characterizing the Google Books Corpus: Strong Limits to Inferences of Socio-Cultural and Linguistic Evolution // PLOS ONE 10(10): e0137041", "url": "https://doi.org/10.1371/journal.pone.0137041"}], "label": "Культуромика"}, {"id": "milligan", "lane": "reflection", "kind": "point", "start": 2013, "end": null, "title": "Миллиган: «Иллюзорный порядок»", "orig": "Illusionary Order: Online Databases, Optical Character Recognition, and Canadian History, 1997–2010", "short": "Оцифрованные газеты незаметно перестроили канадскую историографию: доступность определила выбор источников.", "description": "Статья Иэна Миллигана (Canadian Historical Review, декабрь 2013; первая версия аргумента — пост в блоге ActiveHistory в 2012 году) о том, как онлайн-базы газет изменили канадскую историографию 1997–2010 годов. Сопоставляя диссертации до и после оцифровки Toronto Star и Globe and Mail, Миллиган показывает, что ссылки на оцифрованные издания резко выросли, а на неоцифрованные нет. Поиск идёт по OCR, сделанному коммерческими подрядчиками и рассчитанному на деловые документы, с заметной долей ошибок, а историки почти никогда не оговаривают, что пользовались поиском. Порядок, который база навязывает исследованию, иллюзорен: доступность определяет выбор источников, а невидимые ошибки распознавания — то, что вообще будет найдено. Это рефлексия над всей полосой цифрового двойника: двойник меняет не только объект, но и практику историка, причём незаметно для него самого. Вопрос не закрывается и возвращается позже у Патнэм (2016).", "labor": true, "sources": [{"author": "Milligan I.", "year": 2013, "title": "Illusionary Order: Online Databases, Optical Character Recognition, and Canadian History, 1997–2010 // Canadian Historical Review 94(4): 540–569", "url": "https://uwspace.uwaterloo.ca/handle/10012/11748"}, {"author": "Milligan I.", "year": 2012, "title": "Illusionary Order: Cautionary Notes for Online Newspapers // ActiveHistory.ca", "url": "https://activehistory.ca/blog/2012/03/26/illusionary-order/"}, {"author": "Putnam L.", "year": 2016, "title": "The Transnational and the Text-Searchable: Digitized Sources and the Shadows They Cast // American Historical Review 121(2)", "url": null}], "label": "Миллиган"}, {"id": "brugger", "lane": "reflection", "kind": "point", "start": 2018, "end": null, "title": "Брюггер: «Архивный веб»", "orig": "The Archived Web: Doing History in the Digital Age", "short": "Оцифрованное, born-digital и reborn-digital: архивный веб требует собственной критики источника.", "description": "Книга Нильса Брюггера (MIT Press) различает оцифрованный материал, born-digital и reborn-digital — изначально цифровой материал, который был собран, сохранён и этим изменён. Архивный веб, по Брюггеру, отличается от живого: он собран краулером по определённым правилам, неполон во времени и составе, податлив, и потому требует собственной критики источника — провенанса, сравнения версий, правил цитирования. Это теоретическое оформление того, что практика показывала с 1996 года (Internet Archive), в 2009–2010 годах (GeoCities) и в 2010-м (эмуляция Рушди и само слово reborn у архивистов). Для тезиса шкалы точка ключевая: проблема цифрового двойника, казалось бы снятая born-digital материалом, возвращается, и Брюггер переносит на архивный веб приёмы классического источниковедения. Здесь встречаются две оптики: гуманитарный метод перестраивается под цифровой объект. Типология Брюггера отчасти задаёт и структуру шкалы, хотя reborn-digital на ней не выделен в отдельную полосу ради читаемости.", "sources": [{"author": "Brügger N.", "year": 2018, "title": "The Archived Web: Doing History in the Digital Age. MIT Press", "url": null}, {"author": "College & Research Libraries", "year": 2020, "title": "Рецензия на The Archived Web", "url": "https://crl.acrl.org/index.php/crl/article/view/24253/32069"}], "label": "Брюггер"}, {"id": "lavin", "lane": "reflection", "kind": "point", "start": 2021, "end": null, "title": "Лавин: ситуированные данные вместо capta", "orig": "Why Digital Humanists Should Emphasize Situated Data over Capta", "short": "Данные взяты кем-то, где-то и с какой-то целью: новый словарь для проблемы, поставленной ещё Гутманом.", "description": "Статья Мэтью Лавина в DHQ возвращается к Дракер через десять лет и открывает новый виток обсуждения. Лавин не спорит с тем, что данные сконструированы; он спорит с аргументом из этимологии. У английского data минимум три исторических значения: геометрическое (данное в задаче у Евклида), теологическое (истины откровения) и эмпирическое (сведения, полученные наблюдением, с XVII века). Переносить на третье значение неоспоримость первых двух ошибочно, а даже у Евклида «данное» — результат операции. У capta, напротив, свои нежелательные коннотации захвата и плена. Вместо смены термина Лавин предлагает говорить о ситуированных данных, опираясь на «Data Feminism» Д'Игнацио и Клейн и через них на ситуированное знание Харауэй: данные взяты кем-то, где-то и с какой-то целью. Эта формула задним числом описывает и спор Гутмана с Фогелем и Энгерманом, и базу работорговли, где точка зрения учётчика зашита в источник. Шкала замыкается новым словарём для проблемы перевода, а не её решением. Уязвимое место статьи: Лавин строит длинную этимологию против этимологии Дракер, а затем предлагает вообще не аргументировать от происхождения слова.", "sources": [{"author": "Lavin M.", "year": 2021, "title": "Why Digital Humanists Should Emphasize Situated Data over Capta // DHQ 15(2)", "url": "https://digitalhumanities.org/dhq/vol/15/2/000556/000556.html"}, {"author": "D'Ignazio C., Klein L. F.", "year": 2020, "title": "Data Feminism. MIT Press", "url": "https://data-feminism.mitpress.mit.edu/"}], "label": "Лавин"}], "links": [{"from": "busa", "to": "tei", "why": "Что считать единицей текста: у Бузы это решение принимается молча при перфорировании, в TEI становится предметом спора."}, {"from": "busa", "to": "culturomics", "why": "Та же операция — текст в счётные единицы — на пяти миллионах книг, теперь через OCR-двойника."}, {"from": "busa", "to": "drucker", "why": "Интерпретативность перевода в данные получает общее имя примерно через шестьдесят лет."}, {"from": "fogel", "to": "slavetrade", "why": "Взгляд учётчика, зашитый в источник: от записей одной плантации к инфраструктуре из 35 тысяч рейсов."}, {"from": "fogel", "to": "lavin", "why": "То, что Гутман делал вручную, пересчитывая записи плантатора, Лавин называет ситуированными данными."}, {"from": "slavetrade", "to": "lavin", "why": "Критика Джонсон и ситуированные данные Лавина описывают одну проблему: язык учёта переходит в формат базы."}, {"from": "tei", "to": "beowulf", "why": "Две модели цифрового двойника внутри одной полосы: TEI кодирует текст, «Беовульф» снимает документ."}, {"from": "tei", "to": "drucker", "why": "TEI назвала интерпретацию целью кодирования в 1987 году, за 24 года до capta."}, {"from": "beowulf", "to": "rushdie", "why": "Копия как реконструкция: ультрафиолетовая съёмка и эмуляция среды дают свидетельство, которого нет в оригинале."}, {"from": "beowulf", "to": "milligan", "why": "Двойник «Беовульфа» видит больше оригинала, газетный OCR видит меньше, и этого никто не замечает."}, {"from": "culturomics", "to": "milligan", "why": "Смещения OCR наследуются результатами незаметно для исследователя."}, {"from": "ia", "to": "rosenzweig", "why": "Семь лет между появлением архива и вопросом историков о нём как об источнике."}, {"from": "ia", "to": "geocities", "why": "Институциональный архив и партизанское спасение: два пути, которыми born-digital становится reborn-digital."}, {"from": "ia", "to": "brugger", "why": "Архивная копия не совпадает с живым вебом; Брюггер делает из этого программу критики источника."}, {"from": "rushdie", "to": "brugger", "why": "Слово reborn digital звучит у архивистов Эмори за восемь лет до типологии Брюггера."}, {"from": "geocities", "to": "brugger", "why": "Перерождение под угрозой полной потери: сам акт спасения становится частью истории объекта."}, {"from": "rosenzweig", "to": "milligan", "why": "Розенцвейг описывает логику «сохранить всё и искать поисковиком»; Миллиган показывает, что поиск сделал с историографией."}, {"from": "drucker", "to": "lavin", "why": "Спор о слове через десять лет: Лавин принимает конструктивизм Дракер, но отвергает аргумент от этимологии."}], "intro": ["Этот таймлайн не претендует на историю digital humanities целиком. Он прослеживает одну линию: что происходит с объектом гуманитарного исследования, когда он переходит из не-цифрового состояния в цифровое или изначально существует как цифровой. Я начинал из рабочего определения DH как применения цифровых методов к не-цифровым объектам. Для меня оно опирается на работы до DH, например, обсуждаемого на лекции Ковальченко, у которого количественный и качественный анализ сходятся в одном вопросе — как соотносятся подсчёт и интерпретация источника. А ещё на Бузу с его машинным словоуказателем к книгам Фомы Аквинского. По ходу работы это определение оказалось неустойчивым, потому что почти в каждом случае цифровой метод работал с моделью объекта, которую кто-то заранее построил, и потом сама модель становилась предметом гуманитарной критики. Поэтому в центре шкалы стоит проблема перевода: что теряется и что добавляется, когда объект становится данными, копией или архивной записью, и чей взгляд при этом закрепляется.", "События разложены по четырём осям. Извлечённые данные — случаи, когда из источника получают счётные единицы: словоформы, записи о сделках, рейсы. Цифровой двойник — когда источник получает цифровую копию: размеченный текст, изображение, распознанный текст. Born-digital — объекты без не-цифрового оригинала, которые доходят до исследователя только через архив. Рефлексия — тексты, где проблема перевода названа и обсуждается.", "Тезис, заложенный в шкалу заключается в том, что проблема перевода не решается раз и навсегда и не сменяется следующей стадией. Она возвращается в каждой полосе на новом материале, а рефлексия, как правило, отстаёт от практики на годы или десятилетия. Дуги между событиями показывают эти возвращения, у каждой есть короткое пояснение. Периоды при этом пересекаются: даже при появлении Born Digital объектов извлечение данных и двойники не пропадают.", "Отрезки на шкале обозначают проекты и процессы, точки — публикации. Это события разного масштаба, и я сопоставляю их по тому, как в них ставится проблема перевода, а не по длительности или влиянию. Отбор неполный и в основном англо-американский: я выбирал случаи, где проблема видна отчётливо, а не самые известные проекты. Есть и второстепенная линия — скрытый труд. События, где перевод держится на работе людей, которых история DH обычно не называет, отмечены отдельно."], "conclusion": ["На шкале видны три повторяющихся хода. Решение Бузы о том, что считать единицей текста, возвращается в спорах вокруг TEI, в культуромике и в другой форме в эмуляции компьютера Рушди: каждый раз объект анализа оказывается моделью, построенной до анализа. Рефлексия запаздывает: Розенцвейг пишет об архиве через семь лет после его основания, слово capta появляется у Дракер через шестьдесят лет после перфокарт, reborn-digital у Брюггера — через восемь лет после того, как его произнесли архивисты Эмори. Вопрос о взгляде, зашитом в источник, проходит от Гутмана через базу работорговли к ситуированным данным Лавина; словарь меняется, сам вопрос остаётся.", "Отсюда поправка к исходному определению. Меня в DH интересует операция перевода между не-цифровым и цифровым и критика её результатов; тип метода и тип объекта оказываются производными от неё."], "ai": "Я использовал ИИ (Claude, Anthropic) на трёх этапах. При формулировке идеи он критиковал мои варианты рамки и помогал их оформить. Затем он помогал искать и отбирать события. После рецензий я использовал его, чтобы собрать этот новый таймлайн: нагляднее прежнего и точнее отражающий то, что я хотел показать."};
const LANE = {}; D.lanes.forEach(l => LANE[l.id] = l);

const neighbors = id => D.links.filter(l => l.from === id || l.to === id);

const svg = document.getElementById('tl'), scroller = document.getElementById('scroller'), tip = document.getElementById('tip');
let G = {}, u = 14, X, Yr, axisY, nodes = {};
const P0 = 1945, SEG1 = 1956, SEG2 = 1984, CMP = 0.25, PAD = 28;
function mkScale() {
  const avail = Math.max(320, scroller.clientWidth - PAD * 2);
  u = Math.max(13, avail / (11 + 28 * CMP + 42)) * st.zoom;
  X = y => { let p; if (y <= SEG1) p = y - P0; else if (y <= SEG2) p = 11 + (y - SEG1) * CMP; else p = 11 + 28 * CMP + (y - SEG2); return PAD + p * u; };
  Yr = px => { const p = (px - PAD) / u; if (p <= 11) return P0 + p; if (p <= 11 + 28 * CMP) return SEG1 + (p - 11) / CMP; return SEG2 + (p - 11 - 28 * CMP); };
}
const meas = document.createElement('canvas').getContext('2d');
const tw = s => { meas.font = '500 12.5px "IBM Plex Sans Condensed", "Arial Narrow", sans-serif'; return meas.measureText(s).width; };
const label = e => e.end === null && e.kind === 'span' ? e.label + ' →' : e.label;

function render() {
  mkScale();
  svg.innerHTML = '';
  let W = Math.ceil(X(NOW) + PAD + 10);
  const ARC = 150; axisY = ARC + 30; const rowH = 28, top = axisY + 22;
  // pack
  const items = D.events.map(e => {
    const x0 = X(e.start), x1 = e.kind === 'span' ? Math.max(X((e.end ?? NOW)) + (e.end ? u * 0.6 : 0), x0 + 7) : x0;
    const lw = tw(label(e)) + (e.labor ? 14 : 0);
    const inside = e.kind === 'span' && (x1 - x0) >= lw + 16;
    const occ0 = e.kind === 'span' ? x0 - 2 : x0 - 7;
    const occ1 = inside ? x1 : (e.kind === 'span' ? x1 : x0 + 2) + 8 + lw;
    return {e, x0, x1, lw, inside, occ0, occ1, ax: e.kind === 'span' ? x0 + Math.min((x1 - x0) / 2, 6) : x0};
  }).sort((a, b) => a.occ0 - b.occ0);
  const rows = [];
  items.forEach(it => { let r = rows.findIndex(end => end + 10 <= it.occ0); if (r < 0) { r = rows.length; rows.push(0); } rows[r] = it.occ1; it.row = r; });
  W = Math.max(W, Math.ceil(Math.max(...items.map(i => i.occ1)) + 16));
  const H = top + rows.length * rowH + 12;
  svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  // grid + axis
  const gGrid = el('g', {}, svg);
  const ticks = [];
  const step = u * 5 > 70 ? 5 : 10;
  for (let y = 1950; y <= 2020; y += step) { if (y > SEG1 && y < SEG2 && y !== 1970) continue; ticks.push(y); }
  ticks.forEach(y => {
    const x = X(y);
    el('line', {x1: x, x2: x, y1: axisY, y2: H - 6, class: 'grid'}, gGrid);
    el('line', {x1: x, x2: x, y1: axisY - 4, y2: axisY + 4, class: 'tick'}, gGrid);
    el('text', {x, y: axisY - 10, 'text-anchor': 'middle', class: 'yr'}, gGrid).textContent = y;
  });
  el('line', {x1: PAD - 10, x2: W - 6, y1: axisY, y2: axisY, class: 'axis'}, gGrid);
  [SEG1, SEG2].forEach(y => { const x = X(y); el('path', {d: `M${x - 5} ${axisY + 6} L${x - 1} ${axisY - 6} M${x + 1} ${axisY + 6} L${x + 5} ${axisY - 6}`, class: 'tick'}, gGrid); });
  G.arcs = el('g', {}, svg);
  G.drops = el('g', {}, svg);
  G.cur = el('g', {}, svg);
  const gEv = el('g', {}, svg);
  nodes = {};
  items.forEach(it => {
    const e = it.e, y = top + it.row * rowH;
    const g = el('g', {class: 'ev', tabindex: 0, role: 'button', 'aria-label': `${e.title}, ${yrs(e)}, ${LANE[e.lane].title}`, style: `--c:${COL[e.lane]}`}, gEv);
    g.dataset.id = e.id;
    if (e.kind === 'span') el('rect', {x: it.x0, y: y, width: it.x1 - it.x0, height: 16, rx: 3, class: 'mk'}, g);
    else el('circle', {cx: it.x0, cy: y + 8, r: 6.5, class: 'mk'}, g);
    const tx = it.inside ? it.x0 + 7 : (e.kind === 'span' ? it.x1 : it.x0 + 3) + 8;
    const t = el('text', {x: tx, y: y + 12.5, class: 'lab'}, g); t.textContent = label(e);
    if (e.labor) { const lx = tx + t.getComputedTextLength() + 9, ly = y + 8; el('path', {d: `M${lx} ${ly - 4} L${lx + 4} ${ly} L${lx} ${ly + 4} L${lx - 4} ${ly} Z`, class: 'lbr'}, g); }
    el('title', {}, g).textContent = `${e.title} · ${yrs(e)}`;
    nodes[e.id] = {g, ax: it.ax, y, it};
    g.addEventListener('mouseenter', () => { st.hover = e.id; st.cursor = null; apply(); });
    g.addEventListener('mouseleave', () => { st.hover = null; apply(); });
    g.addEventListener('focus', () => { st.hover = e.id; apply(); });
    g.addEventListener('blur', () => { st.hover = null; apply(); });
    g.addEventListener('click', ev => { ev.stopPropagation(); select(e.id); });
    g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(e.id); } });
  });
  G.H = H; G.W = W;
  apply();
}

function arcPath(a, b) {
  const xa = Math.min(a, b), xb = Math.max(a, b), h = Math.min(140, 22 + (xb - xa) * 0.42);
  return `M${xa} ${axisY} C${xa} ${axisY - h}, ${xb} ${axisY - h}, ${xb} ${axisY}`;
}

function apply() {
  const focus = st.hover || (st.cursor === null ? st.sel : null);
  G.arcs.innerHTML = ''; G.drops.innerHTML = ''; G.cur.innerHTML = '';
  let lit = null;
  if (st.all) D.links.forEach(l => el('path', {d: arcPath(nodes[l.from].ax, nodes[l.to].ax), class: 'arc faint'}, G.arcs));
  if (st.cursor !== null && !st.hover) {
    const y = st.cursor;
    lit = new Set(D.events.filter(e => e.kind === 'span' ? (e.start <= y && y <= (e.end ?? NOW)) : e.start === y).map(e => e.id));
    const x = X(y + 0.5);
    el('line', {x1: x, x2: x, y1: axisY - 22, y2: G.H - 4, class: 'cur'}, G.cur);
    const bw = 44; el('rect', {x: x - bw / 2, y: axisY - 34, width: bw, height: 20, rx: 4, class: 'curbg'}, G.cur);
    el('text', {x, y: axisY - 19.5, 'text-anchor': 'middle', class: 'curlab'}, G.cur).textContent = y;
    statusYear(y, lit);
  } else if (focus) {
    const ns = neighbors(focus);
    lit = new Set([focus, ...ns.map(l => l.from === focus ? l.to : l.from)]);
    ns.forEach(l => {
      const p = arcPath(nodes[l.from].ax, nodes[l.to].ax);
      el('path', {d: p, class: 'arc'}, G.arcs);
      const hit = el('path', {d: p, class: 'arc hit'}, G.arcs);
      hit.addEventListener('mouseenter', ev => showTip(ev, l));
      hit.addEventListener('mousemove', ev => moveTip(ev));
      hit.addEventListener('mouseleave', () => tip.hidden = true);
    });
    lit.forEach(id => { const n = nodes[id]; el('line', {x1: n.ax, x2: n.ax, y1: axisY, y2: n.y, class: 'drop'}, G.drops); });
    statusFocus(focus, ns.length);
  } else statusIdle();
  D.events.forEach(e => {
    const n = nodes[e.id]; if (!n) return;
    const offLane = st.lanes.size && !st.lanes.has(e.lane);
    n.g.classList.toggle('dim', offLane || (lit && !lit.has(e.id)));
    n.g.classList.toggle('hl', !!(lit && lit.has(e.id)));
    n.g.classList.toggle('sel', e.id === st.sel);
  });
}

const status = document.getElementById('status');
const dot = (e, full) => `<span class="it"><span class="dot" style="--c:${COL[e.lane]}"></span>${esc(full ? e.title : e.label)}</span>`;
function statusYear(y, lit) {
  const list = D.events.filter(e => lit.has(e.id));
  status.innerHTML = `<b>${y}</b>` + (list.length ? list.map(dot).join('') : '<span>в этот год на шкале ничего не происходит</span>');
}
function statusFocus(id, n) {
  const e = EV[id];
  status.innerHTML = `<b>${yrs(e)}</b>${dot(e, true)}<span>${n} ${n === 1 ? 'связь' : n < 5 ? 'связи' : 'связей'} · наведите на дугу, чтобы прочитать пояснение</span>`;
}
function statusIdle() { status.innerHTML = '<span>Ведите курсором по шкале</span>'; }

function showTip(ev, l) {
  tip.innerHTML = `<b>${esc(EV[l.from].title)} → ${esc(EV[l.to].title)}</b><br>${esc(l.why)}`;
  tip.hidden = false; moveTip(ev);
}
function moveTip(ev) {
  const r = scroller.getBoundingClientRect();
  let x = ev.clientX - r.left + scroller.scrollLeft + 14, y = ev.clientY - r.top + 14;
  const maxX = scroller.scrollLeft + scroller.clientWidth - tip.offsetWidth - 8;
  tip.style.left = Math.min(x, maxX) + 'px'; tip.style.top = Math.max(4, y) + 'px';
}

svg.addEventListener('mousemove', ev => {
  if (ev.target.closest('.ev') || ev.target.classList.contains('hit')) return;
  const r = svg.getBoundingClientRect();
  const y = Math.floor(Yr(ev.clientX - r.left));
  if (y < P0 || y > NOW) return;
  if (st.cursor !== y || st.hover) { st.cursor = y; st.hover = null; tip.hidden = true; apply(); }
});
svg.addEventListener('mouseleave', () => { st.cursor = null; tip.hidden = true; apply(); });
svg.addEventListener('click', ev => {
  if (ev.target.closest('.ev')) return;
  const r = svg.getBoundingClientRect(); const y = Math.floor(Yr(ev.clientX - r.left));
  if (y >= P0 && y <= NOW) { st.cursor = y; st.hover = null; apply(); }
});

function select(id, scroll) {
  st.sel = id; st.cursor = null; renderCard(); apply();
  if (scroll) { const n = nodes[id]; scroller.scrollTo({left: Math.max(0, n.ax - scroller.clientWidth / 2), behavior: 'smooth'}); }
}

const card = document.getElementById('card');
function renderCard() {
  const e = EV[st.sel];
  card.style.setProperty('--c', COL[e.lane]);
  const out = D.links.filter(l => l.from === e.id), inc = D.links.filter(l => l.to === e.id);
  const li = (l, other) => `<li><button data-go="${other}" style="--c:${COL[EV[other].lane]}"><span class="t">${esc(EV[other].title)}</span><span class="w">${esc(l.why)}</span></button></li>`;
  const src = e.sources.map(s => `<li><span class="au">${esc(s.author)}${s.year ? ` (${s.year})` : ''}.</span> ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}</li>`).join('');
  card.innerHTML = `<div>
      <div class="meta"><span class="tag">${esc(LANE[e.lane].title)}</span><span>${esc(yrs(e))}</span><span>${e.kind === 'span' ? 'проект или процесс' : 'публикация'}</span></div>
      <h2>${esc(e.title)}</h2><p class="orig">${esc(e.orig)}</p>
      <p class="short">${esc(e.short)}</p>
      <p class="desc">${esc(e.description)}</p>
      ${e.labor ? '<div class="labor"><svg width="12" height="12" aria-hidden="true"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>Линия скрытого труда</div>' : ''}
    </div>
    <div class="side">
      ${out.length ? `<div><h3>Возвращается в</h3><ul class="lk">${out.map(l => li(l, l.to)).join('')}</ul></div>` : ''}
      ${inc.length ? `<div><h3>Продолжает</h3><ul class="lk">${inc.map(l => li(l, l.from)).join('')}</ul></div>` : ''}
      <div><h3>Источники</h3><ul class="src">${src}</ul></div>
    </div>`;
  card.querySelectorAll('[data-go]').forEach(b => b.onclick = () => select(b.dataset.go, true));
}

const all = [];
D.events.forEach(e => e.sources.forEach(s => all.push(s)));
const seen = new Set();
document.getElementById('allsrc').innerHTML = all.filter(s => { const k = s.author + s.title; if (seen.has(k)) return false; seen.add(k); return true; })
  .sort((a, b) => a.author.localeCompare(b.author))
  .map(s => `<li><span class="au">${esc(s.author)}${s.year ? ` (${s.year})` : ''}.</span> ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}</li>`).join('');

const ZL = [1, 1.5, 2.25, 3.4, 5];
const zval = document.getElementById('zval');
function setZoom(z, px) {
  px = px ?? scroller.clientWidth / 2;
  const yAt = Yr(scroller.scrollLeft + px);
  st.zoom = Math.min(5, Math.max(1, z));
  try { localStorage.setItem('dh-zoom', st.zoom); } catch (e) {}
  zval.textContent = (Math.round(st.zoom * 10) / 10) + '×';
  render();
  scroller.scrollLeft = Math.max(0, X(yAt) - px);
}
document.getElementById('zin').onclick = () => setZoom(ZL.find(z => z > st.zoom + 0.01) ?? 5);
document.getElementById('zout').onclick = () => setZoom([...ZL].reverse().find(z => z < st.zoom - 0.01) ?? 1);
document.getElementById('zreset').onclick = () => { setZoom(1); scroller.scrollLeft = 0; };
scroller.addEventListener('wheel', ev => {
  if (!ev.ctrlKey) return;
  ev.preventDefault();
  const r = scroller.getBoundingClientRect();
  setZoom(st.zoom * (ev.deltaY < 0 ? 1.12 : 1 / 1.12), ev.clientX - r.left);
}, {passive: false});
document.getElementById('allLinks').onclick = function () { st.all = !st.all; this.setAttribute('aria-pressed', st.all); apply(); };

zval.textContent = (Math.round(st.zoom * 10) / 10) + '×';
render(); renderCard();
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>

</body></html>
